services:
  api:
    build:
      context: ./server
    container_name: ghaf-api
    restart: unless-stopped
    env_file:
      - server/.env
    volumes:
      - ghaf_data:/data
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m
    labels:
      marfa.business: "ghaf"
      marfa.service: "api"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ghaf
    restart: unless-stopped
    depends_on:
      - api

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m
        reservations:
          cpus: "0.1"
          memory: 32m

    ports:
      - "${APP_PORT:-8084}:80"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    labels:
      marfa.business: "ghaf"
      marfa.service: "web"

volumes:
  ghaf_data:
