services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ghaf
    restart: unless-stopped

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m
        reservations:
          cpus: "0.1"
          memory: 32m

    ports:
      - "${APP_PORT:-8084}:80"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    labels:
      marfa.business: "ghaf"
      marfa.service: "web"
