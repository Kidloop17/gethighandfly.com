map $http_accept_language $detected_lang {
    default               "en";
    ~*^ru                 "ru";
    ~*^vi                 "vi";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # ── Gzip ─────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/xml
        application/ld+json
        image/svg+xml;

    # ── Security headers ───────────────────────────────────────────────
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header X-Frame-Options           "DENY"                                always;
    add_header X-XSS-Protection          "1; mode=block"                       always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # ── i18n: редирект / → нужная локаль ─────────────────────────────
    location = / {
        # Cookie lang перебивает Auto-detect
        set $lang $detected_lang;
        if ($cookie_lang = "en") { set $lang "en"; }
        if ($cookie_lang = "ru") { set $lang "ru"; }
        if ($cookie_lang = "vi") { set $lang "vi"; }
        return 302 /$lang/;
    }

    # ── Aggressive cache for hashed Astro assets ──────────────────────
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Sitemap & robots ──────────────────────────────────────────────
    location = /sitemap-index.xml { try_files $uri =404; }
    location = /sitemap-0.xml     { try_files $uri =404; }
    location = /robots.txt        { try_files $uri =404; access_log off; }

    # ── Serve static ──────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "public, max-age=300";
    }

    # ── Custom 404 ────────────────────────────────────────────────────
    error_page 404 /404.html;
    location = /404.html { internal; }
}
